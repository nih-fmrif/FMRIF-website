name: Build and deploy Pelican site

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Optional absolute SITEURL for this build, such as https://fmrif.nimh.nih.gov"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compute site URL
        id: site
        shell: bash
        env:
          REQUESTED_SITE_URL: ${{ github.event.inputs.site_url }}
        run: |
          if [[ -n "${REQUESTED_SITE_URL}" ]]; then
            echo "url=${REQUESTED_SITE_URL}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REPOSITORY#*/}" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_OUTPUT"
          else
            repo_name="${GITHUB_REPOSITORY#*/}"
            echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        env:
          SITEURL: ${{ steps.site.outputs.url }}
        run: |
          mkdir -p content/pdf
          pelican content -o output -s publishconf.py
          touch output/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

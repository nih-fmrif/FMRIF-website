{% extends "base.html" %}
{% block title %}Search | {{ SITENAME }}{% endblock %}
{% block content %}
<section class="page">
  <header class="page-header">
    <h1>Search</h1>
  </header>

  <form class="search-form" role="search">
    <label for="site-search">Search this site</label>
    <div class="search-control">
      <input id="site-search" name="q" type="search" autocomplete="off" placeholder="Search staff, scanners, courses, publications...">
      <button type="submit">Search</button>
    </div>
  </form>

  <p class="search-status" data-search-status></p>
  <div class="search-results" data-search-results></div>
</section>

<script>
  (() => {
    const form = document.querySelector('.search-form');
    const input = document.querySelector('#site-search');
    const status = document.querySelector('[data-search-status]');
    const results = document.querySelector('[data-search-results]');
    let searchIndex = [];

    const params = new URLSearchParams(window.location.search);
    input.value = params.get('q') || '';

    const normalize = (value) => value.toLowerCase().replace(/\s+/g, ' ').trim();
    const escapeHtml = (value) => value.replace(/[&<>"']/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
    })[char]);

    const render = () => {
      const query = normalize(input.value);
      if (!query) {
        status.textContent = 'Enter a search term.';
        results.innerHTML = '';
        return;
      }

      const terms = query.split(' ').filter(Boolean);
      const matches = searchIndex
        .map((item) => {
          const haystack = normalize(`${item.title} ${item.type} ${item.text}`);
          const score = terms.reduce((total, term) => total + (haystack.includes(term) ? 1 : 0), 0);
          return { item, score };
        })
        .filter(({ score }) => score === terms.length)
        .slice(0, 40);

      status.textContent = matches.length === 1 ? '1 result' : `${matches.length} results`;
      results.innerHTML = matches.map(({ item }) => `
        <article class="search-result">
          <a href="${item.url}">
            <small>${escapeHtml(item.type)}</small>
            <h2>${escapeHtml(item.title)}</h2>
            ${item.summary ? `<p>${escapeHtml(item.summary)}</p>` : ''}
          </a>
        </article>
      `).join('');
    };

    fetch('{{ SITEURL }}/search-index.json')
      .then((response) => response.json())
      .then((items) => {
        searchIndex = items;
        render();
      })
      .catch(() => {
        status.textContent = 'Search is unavailable right now.';
      });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const query = input.value.trim();
      const url = query ? `/search/?q=${encodeURIComponent(query)}` : '/search/';
      window.history.replaceState(null, '', url);
      render();
    });

    input.addEventListener('input', render);
  })();
</script>
{% endblock %}
